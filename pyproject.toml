[project]
name = "cap-shim"
version = "0.5.0"
description = "Capability shim for AI models — fill the gap with vision & search. 双传输层 (stdio + HTTP/SSE)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "Pillow>=10.0",
]

[project.scripts]
cap-shim = "cap_shim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cap_shim"]
