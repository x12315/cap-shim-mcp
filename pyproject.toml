[project]
name = "mcp-hub"
version = "0.5.0"
description = "MCP 工具集：图片识别 (Qwen-VL) + 联网搜索 (Tavily)，支持 stdio / HTTP-SSE 双传输层"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "Pillow>=10.0",
]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]
