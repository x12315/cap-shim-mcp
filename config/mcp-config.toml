# MCP 服务器注册 — Reasonix / Claude Code 通用参考
# Reasonix:  追加到 ~/.reasonix/config.toml 或 ./reasonix.toml 的 [[plugins]] 段
# Claude Code: 写入 claude_desktop_config.json 或 .mcp.json

# ---- Reasonix 格式 ----
[[plugins]]
name    = "qwen-vision"
command = "python3"
args    = ["/Users/montana/.mcp-servers/vision/server.py"]

[[plugins]]
name    = "tavily-search"
command = "python3"
args    = ["/Users/montana/.mcp-servers/search/server.py"]

# ---- Claude Code 格式 (见 .mcp.json) ----
